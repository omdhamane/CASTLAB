<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop | CASTLAB</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <div class="page-transition">

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
      <div class="nav-left">
        <a href="index.html" class="logo-link">
          <span class="castlab-logo">CASTLAB</span>
        </a>
      </div>

      <nav class="nav-right">
        <a href="index.html">Home</a>
        <a href="shop.html" class="active">Shop</a>
        <a href="wishlist.html" id="wishlistNavLink">Wishlist</a>
        <a href="cart.html" class="cart-nav-link" id="cartNavLink">Cart</a>
        <a href="orders.html" id="ordersNavLink" class="hidden">Orders</a>
        <div class="nav-auth-slot">
          <div class="user-menu hidden" id="userMenu">
            <button type="button" class="user-menu-trigger" id="userMenuTrigger">
              <span class="user-avatar" id="userAvatar">?</span>
              <span class="user-menu-name" id="userMenuName">Account</span>
              <span class="user-menu-chevron">▾</span>
            </button>
            <div class="user-menu-dropdown hidden" id="userMenuDropdown">
              <div class="user-menu-header">
                <strong id="userDropdownName">—</strong>
                <span id="userDropdownEmail">—</span>
              </div>
              <a href="orders.html">My Orders</a>
              <a href="shop.html">Shop</a>
              <button type="button" id="logoutBtn">Sign out</button>
            </div>
          </div>
          <a href="login.html" id="authNavLink">Login</a>
        </div>
      </nav>
    </header>

    <!-- ================= SHOP PAGE ================= -->
    <main class="shop-container">

      <!-- Section Title -->
      <h2 class="shop-title">The Collection</h2>
      <p class="shop-category-label" id="shopCategoryLabel"></p>

      <nav class="category-filters" aria-label="Collections">
        <a href="shop.html?category=jdm-legends">JDM</a>
        <a href="shop.html?category=motorsport">Motorsport</a>
        <a href="shop.html?category=hypercars">Hypercars</a>
        <a href="shop.html?category=muscle-cars">Muscle</a>
        <a href="shop.html?category=suvs">SUVs</a>
      </nav>

      <!-- FILTERS -->
      <section class="filters">
        <button class="filter-btn active btn-ripple" data-scale="1:64" type="button">1:64</button>
        <button class="filter-btn btn-ripple" data-scale="1:32" type="button">1:32</button>
        <button class="filter-btn btn-ripple" data-scale="1:18" type="button">1:18</button>
      </section>

      <!-- PRODUCTS -->
      <section id="productGrid" class="product-grid">
        <!-- Dynamic product cards from shop.js -->
      </section>

    </main>

  </div>

  <!-- ================= SCRIPTS ================= -->

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/transition.js"></script>

</body>
</html>
