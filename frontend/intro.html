<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CASTLAB | Precision in Miniature</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/intro.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <div class="page-transition">

    <section class="hero" id="top">

      <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
      >
        <source src="assets/videos/intro.mp4" type="video/mp4" />
      </video>

      <div class="hero-overlay"></div>

      <div class="hero-content">
        <div class="logo-reveal">
          <h1 class="hero-title">CASTLAB</h1>
        </div>
        <p class="hero-tagline">Precision in Miniature.</p>
        <p class="hero-subtitle">
          Premium diecast models — curated scales, legendary castings, collector-grade presentation.
        </p>

        <div class="hero-actions">
          <a href="shop.html" class="hero-btn btn-ripple">Enter Garage →</a>
          <a href="#explore" class="hero-btn outline btn-ripple">Explore Collections</a>
        </div>
      </div>

      <a href="#explore" class="scroll-indicator" aria-label="Scroll to explore">
        <span>Scroll</span>
        <span class="chevron" aria-hidden="true"></span>
      </a>

    </section>

    <section class="intro-preview" id="explore">
      <h2>Explore by Collection</h2>
      <div class="intro-preview-grid">
        <a href="shop.html?category=jdm-legends" class="preview-pill">JDM Legends</a>
        <a href="shop.html?category=motorsport" class="preview-pill">Motorsport</a>
        <a href="shop.html?category=hypercars" class="preview-pill">Hypercars</a>
        <a href="shop.html?category=muscle-cars" class="preview-pill">Muscle Cars</a>
        <a href="shop.html?category=suvs" class="preview-pill">SUVs</a>
      </div>
      <div class="intro-preview-cta">
        <a href="index.html" class="hero-btn btn-ripple">View Full Showroom</a>
      </div>
    </section>

  </div>

  <script src="js/transition.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
