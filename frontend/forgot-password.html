<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password | CASTLAB</title>
  <link rel="icon" type="image/gif" href="assets/images/icon.gif">
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="login-page">

  <main style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <form class="glass-card auth-form" id="forgotPasswordForm" style="width:420px;padding:32px;">
    <h2 style="margin-bottom:16px;">Forgot Password</h2>
    <p style="margin-bottom:24px; font-size:0.9rem; opacity:0.8;">
      Enter your email address and we will send you a link to reset your password.
    </p>
    <p id="authMessage" class="auth-error" role="alert" style="color:var(--primary);"></p>
    <p id="authError" class="auth-error" role="alert"></p>

    <input id="email" type="email" placeholder="Enter your email" required autocomplete="email" />

    <button type="submit" id="submitBtn">Send Reset Link</button>

    <p style="margin-top:24px; text-align:center;">
      <a href="login.html" style="font-size:0.9rem;">Back to Login</a>
    </p>
  </form>
</main>

  <script src="js/config.js"></script>
  <script>
    document.getElementById("forgotPasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const btn = document.getElementById("submitBtn");
      const msg = document.getElementById("authMessage");
      const err = document.getElementById("authError");

      btn.disabled = true;
      btn.innerText = "Sending...";
      msg.innerText = "";
      err.innerText = "";

      try {
        const res = await fetch(`${API_URL}/auth/forgotpassword`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        if (res.ok) {
          msg.innerText = "If an account exists with this email, a reset link has been sent.";
          msg.style.color = "#4ade80"; // Green success color
          document.getElementById("email").value = "";
        } else {
          err.innerText = data.message || "Failed to send reset email";
        }
      } catch (error) {
        err.innerText = "Network error. Please try again.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
