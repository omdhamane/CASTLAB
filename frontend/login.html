<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | CASTLAB</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">

  <link rel="icon" type="image/png" href="assets/images/icon.png">
</head>
<body class="login-page">

  <main style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <form class="glass-card auth-form" onsubmit="login(event)" style="width:420px;padding:32px;">
    <h2 style="margin-bottom:24px;">Sign in</h2>
    <p id="authError" class="auth-error" role="alert"></p>

    <input id="email" type="email" placeholder="Email" required autocomplete="email" />
    <input id="password" type="password" placeholder="Password" required autocomplete="current-password" />

    <button type="submit">Login</button>

    <p style="margin-top:16px; display: flex; justify-content: space-between; font-size: 0.9rem;">
      <a href="forgot-password.html" style="opacity: 0.8;">Forgot password?</a>
      <a href="register.html">Create account</a>
    </p>
  </form>
</main>


  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
