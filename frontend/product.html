<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product | CASTLAB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>

  <div class="page-transition">

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
      <div class="nav-left">
        <a href="index.html" class="logo-link"><span class="castlab-logo">CASTLAB</span></a>
      </div>

      <nav class="nav-right">
        <a href="index.html">Home</a>
        <a href="shop.html" class="active">Shop</a>
        <a href="wishlist.html" id="wishlistNavLink">Wishlist</a>
        <a href="cart.html" class="cart-nav-link" id="cartNavLink">Cart</a>
        <a href="orders.html" id="ordersNavLink" class="hidden">Orders</a>
        <div class="nav-auth-slot">
          <div class="user-menu hidden" id="userMenu">
            <button type="button" class="user-menu-trigger" id="userMenuTrigger">
              <span class="user-avatar" id="userAvatar">?</span>
              <span class="user-menu-name" id="userMenuName">Account</span>
              <span class="user-menu-chevron">▾</span>
            </button>
            <div class="user-menu-dropdown hidden" id="userMenuDropdown">
              <div class="user-menu-header">
                <strong id="userDropdownName">—</strong>
                <span id="userDropdownEmail">—</span>
              </div>
              <a href="account.html">My Profile</a>
              <a href="orders.html">My Orders</a>
              <a href="shop.html">Shop</a>
              <button type="button" id="logoutBtn">Sign out</button>
            </div>
          </div>
          <a href="login.html" id="authNavLink">Login</a>
        </div>
      </nav>
    </header>

    <!-- ================= PRODUCT PAGE ================= -->
    <main class="product-page">
      <div id="productDetail">
        <p style="opacity:0.6; text-align:center;">Loading product...</p>
      </div>

      <!-- REVIEWS SECTION -->
      <section id="reviewsSection" class="reviews-section hidden">
        <div class="reviews-header">
          <h2>Customer Reviews</h2>
          <div class="reviews-summary">
            <div class="rating-display">
              <span id="avgRatingDisplay" class="avg-rating">0.0</span>
              <div class="stars-display" id="avgStarsDisplay"></div>
              <span id="totalReviewsDisplay" class="total-reviews">0 reviews</span>
            </div>
            <button id="writeReviewBtn" class="btn outline">Write a Review</button>
          </div>
        </div>

        <div id="reviewFormContainer" class="review-form-container glass-card hidden">
          <h3>Write your review</h3>
          <form id="reviewForm">
            <div class="star-rating-input" id="starRatingInput">
              <span data-value="1">★</span><span data-value="2">★</span><span data-value="3">★</span><span data-value="4">★</span><span data-value="5">★</span>
            </div>
            <p id="starRatingHint" style="font-size:0.8rem; margin-bottom:10px; opacity:0.7;">Select a rating</p>
            <input type="hidden" id="reviewRating" value="0" />
            <textarea id="reviewComment" placeholder="Share your thoughts..." rows="4" required></textarea>
            <div class="form-actions" style="margin-top:1rem;">
              <button type="submit" class="btn solid" id="submitReviewBtn">Submit Review</button>
              <button type="button" class="btn outline" id="cancelReviewBtn">Cancel</button>
            </div>
          </form>
        </div>

        <div class="reviews-filters">
          <select id="reviewSort">
            <option value="newest">Newest First</option>
            <option value="highest">Highest Rated</option>
            <option value="lowest">Lowest Rated</option>
          </select>
        </div>

        <div id="reviewsList" class="reviews-list">
          <!-- Reviews injected here -->
        </div>
      </section>
    </main>

  </div>

  <!-- ================= SCRIPTS ================= -->

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/product.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/transition.js"></script>

</body>
</html>
