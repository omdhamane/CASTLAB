<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Invoice | CASTLAB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body style="background:#111; color:white; text-align:center; padding:40px;">

  <h2>Invoice</h2>

  <p id="loading">Loading invoice...</p>

  <iframe 
    id="invoiceFrame"
    style="width:90%; height:600px; border:none; display:none;">
  </iframe>

  <script>
    const BASE_URL = (window.location.hostname === "localhost" || 
                      window.location.hostname === "127.0.0.1" || 
                      window.location.hostname === "")
      ? "http://localhost:5000"
      : "https://castlab-i3hm.onrender.com";

    const params = new URLSearchParams(window.location.search);
    const filePath = params.get("file");

    if (!filePath) {
      document.getElementById("loading").innerText = "Invoice file not found.";
    } else {
      const fullUrl = BASE_URL + filePath;

      const frame = document.getElementById("invoiceFrame");
      frame.src = fullUrl;

      frame.onload = () => {
        document.getElementById("loading").style.display = "none";
        frame.style.display = "block";
      };
    }
  </script>

</body>
</html>
