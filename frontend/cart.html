<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cart | CASTLAB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <style>
    /* Hide scrollbar for checkout modal */
    #checkoutModal::-webkit-scrollbar,
    #checkoutModal .modal-content::-webkit-scrollbar {
      display: none;
    }
    #checkoutModal, #checkoutModal .modal-content {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Premium Checkout Modal Styles */
    .checkout-card {
      max-width: 650px;
      width: 95%;
      background: #0f1012; /* Darker, sleeker background */
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 2.5rem;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
      margin: auto;
    }

    .checkout-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .checkout-header h2 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .checkout-header p {
      color: #9ca3af;
      font-size: 0.95rem;
    }

    .checkout-summary-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .checkout-summary-box h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #e5e7eb;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.75rem;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      font-size: 0.95rem;
      color: #d1d5db;
    }

    .summary-item-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 1.5rem;
    }

    .summary-item-price {
      white-space: nowrap;
      font-weight: 500;
      color: #f3f4f6;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1rem;
      margin-top: 0.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .checkout-form .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .checkout-form .form-group {
      margin-bottom: 1.25rem;
    }

    .checkout-form label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #d1d5db;
    }

    .checkout-form input {
      width: 100%;
      background: #1a1c23;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 1rem;
      color: #fff;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .checkout-form input:focus {
      border-color: #60a5fa;
      background: #21242d;
      outline: none;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
    }

    .checkout-btn-submit {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      color: #000000;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 1.5rem;
    }

    .checkout-btn-submit:hover {
      background: #e5e5e5;
    }

    .checkout-btn-submit:active {
      transform: scale(0.98);
    }

    .checkout-btn-submit:disabled {
      background: #555;
      color: #aaa;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>

<body>

  <div class="page-transition">

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
      <div class="nav-left">
        <a href="index.html" class="logo-link"><span class="castlab-logo">CASTLAB</span></a>
      </div>

      <nav class="nav-right">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="wishlist.html" id="wishlistNavLink">Wishlist</a>
        <a href="cart.html" class="active cart-nav-link" id="cartNavLink">Cart</a>
        <a href="orders.html" id="ordersNavLink" class="hidden">Orders</a>
        <div class="nav-auth-slot">
          <div class="user-menu hidden" id="userMenu">
            <button type="button" class="user-menu-trigger" id="userMenuTrigger">
              <span class="user-avatar" id="userAvatar">?</span>
              <span class="user-menu-name" id="userMenuName">Account</span>
              <span class="user-menu-chevron">▾</span>
            </button>
            <div class="user-menu-dropdown hidden" id="userMenuDropdown">
              <div class="user-menu-header">
                <strong id="userDropdownName">—</strong>
                <span id="userDropdownEmail">—</span>
              </div>
              <a href="account.html">My Profile</a>
              <a href="orders.html">My Orders</a>
              <a href="shop.html">Shop</a>
              <button type="button" id="logoutBtn">Sign out</button>
            </div>
          </div>
          <a href="login.html" id="authNavLink">Login</a>
        </div>
      </nav>
    </header>

    <!-- ================= CART PAGE ================= -->
    <main class="cart-container">
      <h2>Your Cart</h2>

      <div id="cartItems"></div>

      <div class="cart-summary">
        <strong>Total: ₹<span id="cartTotal">0</span></strong>
        <button id="checkoutBtn" class="checkout-btn">
          Proceed to Checkout
        </button>
      </div>
    </main>

    <!-- ================= CHECKOUT MODAL ================= -->
    <div id="checkoutModal" class="modal hidden">
      <div class="modal-content checkout-card">
        <button type="button" id="closeModalBtn" style="position: absolute; top: 1.5rem; right: 1.5rem; background: rgba(255,255,255,0.08); border: none; color: #fff; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; z-index: 10;">✕</button>
        
        <div class="checkout-header">
          <h2>Secure Checkout</h2>
          <p>Review your order and shipping details.</p>
        </div>

        <div class="checkout-summary-box">
          <h3>Order Summary</h3>
          <div id="checkoutItemsList" style="max-height: 160px; overflow-y: auto; margin-bottom: 0.5rem;">
            <!-- Items injected by JS -->
          </div>
          <div class="summary-total">
            <span>Total to Pay</span>
            <span id="checkoutTotalAmount">₹0.00</span>
          </div>
        </div>

        <form id="checkoutForm" class="checkout-form">
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="chkPhone" placeholder="e.g. +91 98765 43210" required />
          </div>
          
          <div class="form-group">
            <label>Street Address</label>
            <input type="text" id="chkAddress" placeholder="e.g. 123 Main St, Apt 4B" required />
          </div>
          
          <div class="form-grid">
            <div class="form-group" style="margin-bottom: 0;">
              <label>City</label>
              <input type="text" id="chkCity" required />
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label>State / Province</label>
              <input type="text" id="chkState" required />
            </div>
          </div>
          
          <div class="form-grid">
            <div class="form-group" style="margin-bottom: 0;">
              <label>ZIP / Postal Code</label>
              <input type="text" id="chkZip" required />
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label>Country</label>
              <input type="text" id="chkCountry" required />
            </div>
          </div>
          
          <button type="submit" class="checkout-btn-submit" id="confirmOrderBtn">Place Secure Order</button>
        </form>
      </div>
    </div>

  </div>

  <!-- ================= SCRIPTS ================= -->

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/transition.js"></script>

</body>
</html>
