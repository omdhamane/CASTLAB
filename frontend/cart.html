<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cart | CASTLAB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <style>
    /* Hide scrollbar for checkout modal */
    #checkoutModal::-webkit-scrollbar,
    #checkoutModal .modal-content::-webkit-scrollbar {
      display: none;
    }
    #checkoutModal, #checkoutModal .modal-content {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body>

  <div class="page-transition">

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
      <div class="nav-left">
        <a href="index.html" class="logo-link">
          <span class="castlab-logo">CASTLAB</span>
        </a>
      </div>

      <nav class="nav-right">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="wishlist.html" id="wishlistNavLink">Wishlist</a>
        <a href="cart.html" class="active cart-nav-link" id="cartNavLink">Cart</a>
        <a href="orders.html" id="ordersNavLink" class="hidden">Orders</a>
        <div class="nav-auth-slot">
          <div class="user-menu hidden" id="userMenu">
            <button type="button" class="user-menu-trigger" id="userMenuTrigger">
              <span class="user-avatar" id="userAvatar">?</span>
              <span class="user-menu-name" id="userMenuName">Account</span>
              <span class="user-menu-chevron">▾</span>
            </button>
            <div class="user-menu-dropdown hidden" id="userMenuDropdown">
              <div class="user-menu-header">
                <strong id="userDropdownName">—</strong>
                <span id="userDropdownEmail">—</span>
              </div>
              <a href="account.html">My Profile</a>
              <a href="orders.html">My Orders</a>
              <a href="shop.html">Shop</a>
              <button type="button" id="logoutBtn">Sign out</button>
            </div>
          </div>
          <a href="login.html" id="authNavLink">Login</a>
        </div>
      </nav>
    </header>

    <!-- ================= CART PAGE ================= -->
    <main class="cart-container">
      <h2>Your Cart</h2>

      <div id="cartItems"></div>

      <div class="cart-summary">
        <strong>Total: ₹<span id="cartTotal">0</span></strong>
        <button id="checkoutBtn" class="checkout-btn">
          Proceed to Checkout
        </button>
      </div>
    </main>

    <!-- ================= CHECKOUT MODAL ================= -->
    <div id="checkoutModal" class="modal hidden" style="align-items: flex-start; padding-top: 5vh; overflow-y: auto;">
      <div class="modal-content auth-card" style="max-width: 600px; width: 100%; position: relative; padding: 2.5rem; margin: auto;">
        <button id="closeModalBtn" class="remove-btn" style="position: absolute; top: 1rem; right: 1rem; background: transparent;">✕</button>
        <div class="auth-header" style="margin-bottom: 1rem;">
          <h2>Confirm Details</h2>
          <p>Review your order summary and shipping information.</p>
        </div>

        <div id="checkoutSummary" class="checkout-summary" style="background: rgba(255, 255, 255, 0.03); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.1);">
          <h3 style="font-size: 1rem; margin-bottom: 0.75rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 0.5rem;">Order Summary</h3>
          <div id="checkoutItemsList" style="font-size: 0.9rem; color: #bbb; max-height: 150px; overflow-y: auto; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem;">
            <!-- Items injected by JS -->
          </div>
          <div style="display: flex; justify-content: space-between; font-weight: bold; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 0.75rem; font-size: 1.1rem; color: #fff;">
            <span>Total:</span>
            <span id="checkoutTotalAmount">₹0.00</span>
          </div>
        </div>

        <form id="checkoutForm" class="auth-form">
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="chkPhone" required />
          </div>
          <div class="form-group">
            <label>Street Address</label>
            <input type="text" id="chkAddress" required />
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label>City</label>
              <input type="text" id="chkCity" required />
            </div>
            <div class="form-group">
              <label>State</label>
              <input type="text" id="chkState" required />
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label>ZIP Code</label>
              <input type="text" id="chkZip" required />
            </div>
            <div class="form-group">
              <label>Country</label>
              <input type="text" id="chkCountry" required />
            </div>
          </div>
          <button type="submit" class="btn solid btn-ripple" id="confirmOrderBtn" style="width: 100%; margin-top: 1rem; padding: 14px; font-size: 1.1rem; border-radius: 8px;">Place Order</button>
        </form>
      </div>
    </div>

  </div>

  <!-- ================= SCRIPTS ================= -->

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/transition.js"></script>

</body>
</html>
