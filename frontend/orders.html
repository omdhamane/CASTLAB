<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="css/base.css" />

  <link rel="icon" type="image/png" href="assets/images/icon.png">

<body>

  <div class="page-transition">
    <header class="navbar">
      <div class="nav-left">
        <a href="index.html" class="logo-link"><span class="castlab-logo">CASTLAB</span></a>
      </div>
      <nav class="nav-right">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="wishlist.html" id="wishlistNavLink">Wishlist</a>
        <a href="cart.html" class="cart-nav-link" id="cartNavLink">Cart</a>
        <a href="orders.html" class="active">Orders</a>
        <div class="nav-auth-slot">
          <div class="user-menu hidden" id="userMenu">
            <button type="button" class="user-menu-trigger" id="userMenuTrigger">

              <span class="user-menu-chevron">▾</span>

              </div>

          </div>
          <a href="login.html" id="authNavLink">Login</a>
        </div>
      </nav>
    </header>

    <main class="orders-page">
      <h2>Order History</h2>
      <p class="section-lead">Your past orders and invoices.</p>

      <div id="ordersEmpty" class="orders-empty hidden">
        <p>No orders yet. <a href="shop.html">Start shopping</a></p>
      </div>

      <div id="ordersList" class="orders-list"></div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/navbar.js"></script>
