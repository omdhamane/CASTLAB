<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Account | CASTLAB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>

  <div class="page-transition">

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
      <div class="nav-left">
        <a href="index.html" class="logo-link"><span class="castlab-logo">CASTLAB</span></a>
      </div>

      <nav class="nav-right">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="wishlist.html" id="wishlistNavLink">Wishlist</a>
        <a href="cart.html" class="cart-nav-link" id="cartNavLink">Cart</a>
        <a href="orders.html" id="ordersNavLink" class="hidden">Orders</a>
        <div class="nav-auth-slot">
          <div class="user-menu hidden" id="userMenu">
            <button type="button" class="user-menu-trigger" id="userMenuTrigger">
              <span class="user-avatar" id="userAvatar">?</span>
              <span class="user-menu-name" id="userMenuName">Account</span>
              <span class="user-menu-chevron">▾</span>
            </button>
            <div class="user-menu-dropdown hidden" id="userMenuDropdown">
              <div class="user-menu-header">
                <strong id="userDropdownName">—</strong>
                <span id="userDropdownEmail">—</span>
              </div>
              <a href="account.html" class="active">My Profile</a>
              <a href="orders.html">My Orders</a>
              <a href="shop.html">Shop</a>
              <button type="button" id="logoutBtn">Sign out</button>
            </div>
          </div>
          <a href="login.html" id="authNavLink">Login</a>
        </div>
      </nav>
    </header>

    <!-- ================= ACCOUNT PAGE ================= -->
    <main class="account-page">
      <div class="auth-card" style="max-width: 600px; width: 100%;">
        <div class="auth-header">
          <h2>My Profile</h2>
          <p>Manage your account details and shipping address.</p>
        </div>

        <form id="profileForm" class="auth-form">
          <div id="profileError" class="auth-error hidden"></div>
          <div id="profileSuccess" class="auth-error hidden" style="background: rgba(46, 213, 115, 0.1); color: #2ed573; border-color: rgba(46, 213, 115, 0.2);"></div>

          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" readonly style="opacity: 0.7; cursor: not-allowed;" />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="+1 234 567 8900" />
          </div>
          
          <h3 style="margin-top: 1.5rem; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; font-size: 1.1rem;">Shipping Address</h3>

          <div class="form-group">
            <label for="address">Street Address</label>
            <input type="text" id="address" placeholder="123 Main St, Apt 4B" />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" />
            </div>
            <div class="form-group">
              <label for="state">State / Province</label>
              <input type="text" id="state" />
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="zipCode">ZIP / Postal Code</label>
              <input type="text" id="zipCode" />
            </div>
            <div class="form-group">
              <label for="country">Country</label>
              <input type="text" id="country" />
            </div>
          </div>

          <button type="submit" class="btn solid btn-ripple" id="saveProfileBtn">Save Profile</button>
        </form>
      </div>
    </main>

  </div>

  <!-- ================= SCRIPTS ================= -->
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/account.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/transition.js"></script>

</body>
</html>
