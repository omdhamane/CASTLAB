<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wishlist | CASTLAB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <div class="page-transition">

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
      <div class="nav-left">
        <a href="index.html" class="logo-link"><span class="castlab-logo">CASTLAB</span></a>
      </div>

      <nav class="nav-right">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="wishlist.html" class="active" id="wishlistNavLink">Wishlist</a>
        <a href="cart.html" class="cart-nav-link" id="cartNavLink">Cart</a>
        <a href="orders.html" id="ordersNavLink" class="hidden">Orders</a>
        <div class="nav-auth-slot">
          <div class="user-menu hidden" id="userMenu">
            <button type="button" class="user-menu-trigger" id="userMenuTrigger">
              <span class="user-avatar" id="userAvatar">?</span>
              <span class="user-menu-name" id="userMenuName">Account</span>
              <span class="user-menu-chevron">▾</span>
            </button>
            <div class="user-menu-dropdown hidden" id="userMenuDropdown">
              <div class="user-menu-header">
                <strong id="userDropdownName">—</strong>
                <span id="userDropdownEmail">—</span>
              </div>
              <a href="account.html">My Profile</a>
              <a href="orders.html">My Orders</a>
              <a href="shop.html">Shop</a>
              <button type="button" id="logoutBtn">Sign out</button>
            </div>
          </div>
          <a href="login.html" id="authNavLink">Login</a>
        </div>
      </nav>
    </header>

    <!-- ================= WISHLIST PAGE ================= -->
    <main class="wishlist-page">
      <h2>Your Wishlist</h2>

      <div id="wishlistToolbar" class="wishlist-toolbar" style="display:none">
        <button type="button" id="moveAllToCart" class="btn solid">Move All to Cart</button>
        <button type="button" id="removeAllWishlist" class="btn outline">Remove All</button>
      </div>

      <div id="wishlistContainer" class="wishlist-grid">
        <!-- JS Injected -->
      </div>
    </main>

  </div>

  <!-- ================= SCRIPTS ================= -->

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/transition.js"></script>

</body>
</html>
