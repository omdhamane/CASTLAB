<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password | CASTLAB</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/png" href="assets/images/icon.png">
</head>
<body class="login-page">

  <main style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <form class="glass-card auth-form" id="resetPasswordForm" style="width:420px;padding:32px;">
    <h2 style="margin-bottom:24px;">Reset Password</h2>
    <p id="authMessage" class="auth-error" role="alert"></p>
    <p id="authError" class="auth-error" role="alert"></p>

    <input id="password" type="password" placeholder="New Password" required autocomplete="new-password" />
    <input id="confirmPassword" type="password" placeholder="Confirm New Password" required autocomplete="new-password" />

    <button type="submit" id="submitBtn">Update Password</button>
  </form>
</main>

  <script src="js/config.js"></script>
  <script>
    document.getElementById("resetPasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      
      if (!token) {
        document.getElementById("authError").innerText = "Invalid or missing reset token.";
        return;
      }

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      
      if (password !== confirmPassword) {
        document.getElementById("authError").innerText = "Passwords do not match.";
        return;
      }

      const btn = document.getElementById("submitBtn");
      const msg = document.getElementById("authMessage");
      const err = document.getElementById("authError");

      btn.disabled = true;
      btn.innerText = "Updating...";
      msg.innerText = "";
      err.innerText = "";

      try {
        const res = await fetch(`${API_URL}/auth/resetpassword/${token}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        
        if (res.ok) {
          msg.innerText = "Password updated successfully! Redirecting to login...";
          msg.style.color = "#4ade80";
          setTimeout(() => {
            window.location.href = "login.html";
          }, 2000);
        } else {
          err.innerText = data.message || "Failed to reset password. The link might be expired.";
        }
      } catch (error) {
        err.innerText = "Network error. Please try again.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Update Password";
      }
    });
  </script>
</body>
</html>
